name: Testar campanha difícil (PR)
on:
  pull_request:
    paths:
      - 'fmstudio/campaign_generator.py'
      - 'fmstudio/mod_gui.py'
      - 'tests/test_campaign_generator.py'
      - '.github/workflows/campaign-generator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar Python (equivalente ao typecheck da base)
        run: python -m compileall -q fmstudio tests app.py updater_main.py
      - name: Testes do gerador
        run: python -m unittest discover -s tests -p test_campaign_generator.py -v
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências do build
        run: python -m pip install pillow pyinstaller
      - name: Testes completos do Studio
        run: python -m unittest discover -s tests -v
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "assets/icons;assets/icons" --collect-all PIL --name FM-Mod-Studio app.py
      - name: Conferir executável
        shell: pwsh
        run: |
          if (-not (Test-Path dist/FM-Mod-Studio.exe)) { throw 'Executável não foi gerado' }
          Write-Host "Build compilado com sucesso."
