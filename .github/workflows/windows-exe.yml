name: FM Mod Studio - Windows e Release
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'studio-v*'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes unitarios
        run: |
          python -m pip install pillow
          python -m unittest discover -s tests -v
      - name: Testar ícone Deus sem pacotes instalados
        run: python -S -m unittest discover -s tests -p test_ps1_god_icon.py -v
      - name: Preparar empacotamento
        run: python -m pip install pyinstaller pillow
      - name: Compilar aplicativo
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "assets/icons;assets/icons" --collect-all PIL --name FM-Mod-Studio app.py
      - name: Compilar atualizador independente
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FM-Mod-Studio-Updater updater_main.py
      - name: Empacotar e gerar checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/FM-Mod-Studio.exe release/FM-Mod-Studio.exe
          Copy-Item dist/FM-Mod-Studio-Updater.exe release/FM-Mod-Studio-Updater.exe
          Copy-Item LEIA-ME.txt release/LEIA-ME.txt
          Copy-Item INICIAR.bat release/INICIAR.bat
          Compress-Archive -Path release/* -DestinationPath FM-Mod-Studio-Windows.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 FM-Mod-Studio-Windows.zip).Hash.ToLowerInvariant()
          "$hash  FM-Mod-Studio-Windows.zip" | Set-Content -Encoding ascii FM-Mod-Studio-Windows.zip.sha256
      - name: Gerar pacote do aplicativo Python (atualização por botão)
        run: python tools/package_source.py --out FM-Mod-Studio-Source.zip
      - name: Publicar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: FM-Mod-Studio-Windows
          path: |
            FM-Mod-Studio-Windows.zip
            FM-Mod-Studio-Windows.zip.sha256
            FM-Mod-Studio-Source.zip
            FM-Mod-Studio-Source.zip.sha256
      - name: Identificar versão no código
        id: version
        shell: pwsh
        run: |
          $v = python -c "from fmstudio import __version__; print(__version__)"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Versão inválida' }
          "tag=studio-v$v" >> $env:GITHUB_OUTPUT
      - name: Publicar GitHub Release automaticamente
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Yu-Gi-Oh Studio FM ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            FM-Mod-Studio-Windows.zip
            FM-Mod-Studio-Windows.zip.sha256
            FM-Mod-Studio-Source.zip
            FM-Mod-Studio-Source.zip.sha256
