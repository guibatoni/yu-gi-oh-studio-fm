name: Validar Studio FM 1.7.8 — IA Difícil nativa PS1
on:
  push:
    branches: [feature/studio-v1.7.8-ps1-hard-ai]
permissions:
  contents: read
jobs:
  ai-ps1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências de teste
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk
          python -m pip install pillow unicorn==2.1.4
      - name: Verificar sintaxe e regressões completas
        run: |
          python -m compileall -q fmstudio tools tests app.py
          python -m unittest discover -s tests -v
      - name: Emular os cinco branches MIPS da IA PS1
        run: PYTHONPATH=. python tests/verify_hard_ai_mips.py
      - name: Executar GUI e salvar seleção de dificuldade
        run: |
          PYTHONPATH=. xvfb-run -a python tests/gui_mod_smoke.py
          PYTHONPATH=. xvfb-run -a python tests/gui_mod_tools_smoke.py
      - name: Verificar pacote de atualização
        run: python tools/package_source.py --out /tmp/FM-Mod-Studio-Source.zip
