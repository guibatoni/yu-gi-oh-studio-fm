name: Verificar otimizacao Pillow PS1 (PR)
on:
  pull_request:
    paths:
      - 'fmstudio/ps1_image_optimizer.py'
      - 'fmstudio/ps1_image_preview.py'
      - 'fmstudio/ps1_content.py'
      - 'fmstudio/ps1_expansion.py'
      - 'fmstudio/core.py'
      - 'fmstudio/gui.py'
      - 'fmstudio/disc_build.py'
      - 'fmstudio/updates.py'
      - 'tests/test_ps1_image_optimizer.py'
      - '.github/workflows/ps1-image-optimizer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pillow-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install pillow
      - name: Sintaxe Python
        run: python -m compileall -q fmstudio tests app.py updater_main.py
      - name: Testes completos
        run: python -m unittest discover -s tests -v
      - name: Testar otimizador sem Pillow
        shell: pwsh
        run: |
          python -S -m unittest discover -s tests -p test_ps1_image_optimizer.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -S -m unittest discover -s tests -p test_ps1_art_fallback.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -S -m unittest discover -s tests -p test_ps1_god_icon.py -v
      - name: Empacotar atualizacao por botao
        run: python tools/package_source.py --out FM-Mod-Studio-Source.zip
