name: Validar Studio FM 1.7.10 - Drops ponderados do deck
on:
  push:
    branches: [feature/studio-v1.7.10-weighted-opponent-deck-drops]
permissions:
  contents: read
jobs:
  weighted-drops:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias de GUI e empacotamento
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk
          python -m pip install pillow
      - name: Sintaxe e testes de regressao
        run: |
          python -m compileall -q app.py fmstudio tools tests
          python -m unittest discover -s tests -v
      - name: Interface de drops do deck e do duelo
        run: |
          PYTHONPATH=. xvfb-run -a python tests/gui_weighted_deck_drops_smoke.py
          PYTHONPATH=. xvfb-run -a python tests/gui_mod_smoke.py
      - name: Verificar pacote do atualizador
        run: python tools/package_source.py --out /tmp/FM-Mod-Studio-Source.zip
