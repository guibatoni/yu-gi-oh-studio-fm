name: Validar Studio FM 1.7.2
on:
  push:
    branches: [validation/studio-v1.7.2]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compilar extensão MIPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu python3-tk python3-pil python3-venv xvfb xauth
          python3 tools/compile_ps1_runtime.py
          echo STUDIO_RUNTIME_BEGIN
          cat fmstudio/ps1_runtime_blob.py
          echo STUDIO_RUNTIME_END
