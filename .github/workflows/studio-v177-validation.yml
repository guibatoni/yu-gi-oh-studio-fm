name: Validar Studio FM 1.7.7 - LP global IA e decks
on:
  push:
    branches: [feature/studio-v1.7.7-global-lp-ai-decks]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ambiente Tkinter e dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk
          python -m pip install pillow unicorn==2.1.4
      - name: Compilar e testar código
        run: |
          python -m compileall -q app.py fmstudio tools tests
          python -m unittest discover -s tests -v
      - name: Verificar inicialização real MIPS de 20000 LP
        run: PYTHONPATH=. python tests/verify_global_lp_init_mips.py
      - name: Testar interfaces com monitor virtual
        run: |
          PYTHONPATH=. xvfb-run -a python tests/gui_mod_smoke.py
          PYTHONPATH=. xvfb-run -a python tests/gui_mod_tools_smoke.py
          PYTHONPATH=. xvfb-run -a python tests/gui_effect_edit_smoke.py
      - name: Pacote do atualizador
        run: python tools/package_source.py --out /tmp/FM-Mod-Studio-Source.zip
