name: Studio FM - branch de desenvolvimento (blob MIPS, testes e pacote de teste)
on:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/studio-branch-teste.yml'
      - 'tools/ps1/campaign_quests.c'
      - 'tools/ps1/campaign_quest_loader.S'
      - 'tools/ps1/campaign_quests.ld'
      - 'tools/compile_ps1_campaign_quests.py'
      - 'fmstudio/campaign_quests.py'
      - 'fmstudio/ps1_campaign_quests.py'
      - 'fmstudio/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recompilar-blob:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Zig 0.13, Unicorn e dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk imagemagick
          python -m pip install ziglang==0.13.0 unicorn==2.1.4 pillow
      - name: Compilar overlay MIPS com Zig 0.13 (fonte da verdade do blob)
        shell: bash
        run: |
          ZIG="$(python -c 'import ziglang,pathlib; print(pathlib.Path(ziglang.__file__).parent / "zig")')"
          "$ZIG" version
          python tools/compile_ps1_campaign_quests.py --zig "$ZIG" --nm nm
          head -16 fmstudio/ps1_campaign_quest_overlay_blob.py
      - name: Testes das quests (inclui MIPS/Unicorn)
        run: python -m unittest discover -s tests -p "test_*quest*.py" -v
      - name: Regressao completa do Studio
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Testes de interface (janela real sob xvfb)
        shell: bash
        env:
          FMSTUDIO_UI_PREFS: ${{ runner.temp }}/interface.json
        run: |
          set -e
          for test in tests/gui*_smoke.py; do
            echo "== $test"
            PYTHONPATH=. xvfb-run -a -s '-screen 0 1600x950x24' python "$test"
          done
      - name: Tradutor online preserva os comandos? (informativo)
        continue-on-error: true
        run: python tools/check_translation_online.py
      - name: Capturas de tela da interface (Linux)
        if: always()
        env:
          FMSTUDIO_UI_PREFS: ${{ runner.temp }}/capturas.json
        run: xvfb-run -a -s '-screen 0 1600x950x24' python tools/ui_screenshots.py capturas-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-linux
          path: capturas-linux
      - name: Publicar capturas (Linux) na branch ui-capturas
        if: always()
        shell: bash
        run: |
          set -e
          [ -d capturas-linux ] || exit 0
          dest="$RUNNER_TEMP/capturas-repo"
          rm -rf "$dest"
          git clone --quiet --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$dest"
          cd "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin ui-capturas >/dev/null; then
            git checkout --quiet ui-capturas
          else
            git checkout --quiet --orphan ui-capturas
            git rm -rfq . || true
          fi
          mkdir -p "run-${{ github.run_number }}"
          cp -r "$GITHUB_WORKSPACE/capturas-linux" "run-${{ github.run_number }}/"
          git add -A
          git commit --quiet -m "capturas Linux run ${{ github.run_number }}"
          for attempt in 1 2 3; do git push --quiet origin ui-capturas && break; git pull --quiet --rebase origin ui-capturas; done
      - name: Gravar blob reproduzivel na branch
        id: commit
        shell: bash
        run: |
          if ! git diff --quiet -- fmstudio/ps1_campaign_quest_overlay_blob.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fmstudio/ps1_campaign_quest_overlay_blob.py
            git commit -m "build(ps1): blob MIPS das quests recompilado com Zig 0.13 pelo CI"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build-windows:
    needs: recompilar-blob
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.recompilar-blob.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install pillow unicorn==2.1.4 pyinstaller
      - name: Testes das quests no Windows
        run: python -m unittest discover -s tests -p "test_*quest*.py" -v
      - name: Interface no Windows (smoke + capturas)
        shell: bash
        env:
          FMSTUDIO_UI_PREFS: ${{ runner.temp }}/interface.json
        run: |
          PYTHONPATH=. python tests/gui_shell_smoke.py
          PYTHONPATH=. python tools/ui_screenshots.py capturas-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-windows
          path: capturas-windows
      - name: Publicar capturas (Windows) na branch ui-capturas
        if: always()
        shell: bash
        run: |
          set -e
          [ -d capturas-windows ] || exit 0
          dest="$RUNNER_TEMP/capturas-repo"
          rm -rf "$dest"
          git clone --quiet --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$dest"
          cd "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin ui-capturas >/dev/null; then
            git checkout --quiet ui-capturas
          else
            git checkout --quiet --orphan ui-capturas
            git rm -rfq . || true
          fi
          mkdir -p "run-${{ github.run_number }}"
          cp -r "$GITHUB_WORKSPACE/capturas-windows" "run-${{ github.run_number }}/"
          git add -A
          git commit --quiet -m "capturas Windows run ${{ github.run_number }}"
          for attempt in 1 2 3; do git push --quiet origin ui-capturas && break; git pull --quiet --rebase origin ui-capturas; done
      - name: Marcar o build de teste
        shell: bash
        run: echo "BUILD = 'teste-dev-${{ github.run_number }}'" > fmstudio/build_info.py
      - name: Compilar Studio de teste
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "assets/icons;assets/icons" --collect-all PIL --name FM-Studio-TESTE app.py
      - name: Conferir o .exe empacotado (traduções incluídas)
        shell: pwsh
        run: |
          $env:FMSTUDIO_SELFTEST = "$env:RUNNER_TEMP\selftest.json"
          Start-Process -FilePath dist/FM-Studio-TESTE.exe -Wait
          $r = Get-Content $env:FMSTUDIO_SELFTEST -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "catalogo=$($r.catalogo) salvar_en=$($r.salvar_en) molduras_ja=$($r.molduras_ja)"
          if ($r.catalogo -lt 700 -or $r.salvar_en -ne 'Save') { throw 'O executável ficou sem as traduções' }
      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/FM-Studio-TESTE.exe release/FM-Studio-TESTE.exe
          Copy-Item docs/HISTORICO.md release/HISTORICO.md
          Compress-Archive -Path release/* -DestinationPath Studio-FM-Teste.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 Studio-FM-Teste.zip).Hash.ToLowerInvariant()
          "$hash  Studio-FM-Teste.zip" | Set-Content -Encoding ascii Studio-FM-Teste.zip.sha256
      - name: Publicar pre-release de teste (ignorada pelo atualizador)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "teste-dev-${{ github.run_number }}"
          $notes = "Versao de TESTE da branch ${{ github.ref_name }} (commit ${{ needs.recompilar-blob.outputs.ref }}). Feche outros Studios, abra FM-Studio-TESTE.exe e gere um BIN/CUE novo. Pre-release: o atualizador nao a instala. Novidades em HISTORICO.md."
          gh release create $tag Studio-FM-Teste.zip Studio-FM-Teste.zip.sha256 --prerelease --target ${{ needs.recompilar-blob.outputs.ref }} --title "Studio FM - teste ${{ github.ref_name }} #${{ github.run_number }}" --notes $notes
