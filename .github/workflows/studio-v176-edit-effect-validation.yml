name: Validar Studio FM 1.7.6 - Editar efeito
on:
  push:
    branches: [feature/studio-v1.7.6-edit-existing-effect]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias e display virtual
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk
          python -m pip install pillow
      - name: Sintaxe e testes de regressao
        run: |
          python -m compileall -q app.py fmstudio tools tests
          python -m unittest discover -s tests -v
      - name: Editar efeito na interface real
        run: |
          PYTHONPATH=. xvfb-run -a python tests/gui_effect_edit_smoke.py
          PYTHONPATH=. xvfb-run -a python tests/gui_continuous_smoke.py
      - name: Validar pacote do atualizador
        run: python tools/package_source.py --out /tmp/FM-Mod-Studio-Source.zip
