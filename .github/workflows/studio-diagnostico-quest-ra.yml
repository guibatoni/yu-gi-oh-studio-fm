name: Studio FM - diagnostico quest RA (sem release)
on:
  push:
    branches:
      - claude/diagnostico-quest-ra
    paths:
      - '.github/workflows/studio-diagnostico-quest-ra.yml'
      - 'fmstudio/campaign_quests.py'
      - 'tests/test_quest_crash_diagnostic.py'
      - 'DIAGNOSTICO_QUEST_RA.bat'
      - 'DIAGNOSTICO_QUEST_DUMP.bat'
      - 'tools/ler_dump_quest.py'
      - 'tools/ps1/campaign_quests.c'
      - 'tools/ps1/campaign_quest_loader.S'
      - 'fmstudio/ps1_campaign_quest_overlay_blob.py'
      - 'fmstudio/ps1_campaign_quests.py'
      - 'tests/test_campaign_quests.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-quest-ra-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Obter codigo do diagnostico
        uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de teste e empacotamento
        run: python -m pip install pillow unicorn==2.1.4 pyinstaller
      - name: Testar quest/VM e ABI MIPS
        run: python -m unittest discover -s tests -p "test_*quest*.py" -v
      - name: Compilar Studio Windows (diagnostico, modo 2 embutido)
        shell: pwsh
        run: |
          Set-Content -Encoding ascii fmstudio/_diagnostic_mode.py "MODE = 2"
          python -c "from fmstudio.ps1_campaign_quests import active_diagnostic_mode as m; assert m() == 2"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "assets/icons;assets/icons" --collect-all PIL --hidden-import fmstudio._diagnostic_mode --name FM-Studio-DIAGNOSTICO app.py
      - name: Empacotar candidato e checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/FM-Studio-DIAGNOSTICO.exe release/FM-Studio-DIAGNOSTICO.exe
          Copy-Item LEIA-ME.txt release/LEIA-ME.txt
          Copy-Item docs/DIAGNOSTICO_QUEST_RA.md release/DIAGNOSTICO_QUEST_RA.md
          Compress-Archive -Path release/* -DestinationPath Studio-FM-Diagnostico-Quest-RA.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 Studio-FM-Diagnostico-Quest-RA.zip).Hash.ToLowerInvariant()
          "$hash  Studio-FM-Diagnostico-Quest-RA.zip" | Set-Content -Encoding ascii Studio-FM-Diagnostico-Quest-RA.zip.sha256
      - name: Disponibilizar binario de teste (sem ROM ou release oficial)
        uses: actions/upload-artifact@v4
        with:
          name: Studio-FM-Diagnostico-Quest-RA
          path: |
            Studio-FM-Diagnostico-Quest-RA.zip
            Studio-FM-Diagnostico-Quest-RA.zip.sha256
          retention-days: 14
      - name: Publicar pre-release de teste (ignorada pelo atualizador)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "diag-quest-ra-${{ github.run_number }}"
          $notes = "Build de DIAGNOSTICO, nao e correcao. Modo 2: feche qualquer Studio aberto, abra FM-Studio-DIAGNOSTICO.exe (o titulo mostra MODO 2), gere um BIN/CUE novo, escolha Doar e duelar; quando o jogo congelar na tela preta, salve um save state (F1) e envie o arquivo da pasta sstates do ePSXe. O nome do BIN gerado termina em _QUESTS_DIAG2 e o titulo do Studio mostra MODO 2. Pre-release: o atualizador do Studio nao a instala. Nao distribuir o BIN gerado."
          gh release create $tag Studio-FM-Diagnostico-Quest-RA.zip Studio-FM-Diagnostico-Quest-RA.zip.sha256 --prerelease --target $env:GITHUB_SHA --title "Studio FM - Diagnostico quest RA (teste)" --notes $notes
