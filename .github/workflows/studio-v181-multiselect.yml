name: Studio FM 1.8.1 - Seleção múltipla
on:
  push:
    branches: [feature/studio-v1.7.11-bulk-multiselect]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias para Tkinter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk
          python -m pip install pillow
      - name: Compilacao e testes
        run: |
          python -m compileall -q app.py fmstudio tools tests
          python -m unittest discover -s tests -v
      - name: Testes reais de selecao multipla e interface existente
        run: |
          PYTHONPATH=. xvfb-run -a python tests/gui_multiselect_smoke.py
          PYTHONPATH=. xvfb-run -a python tests/gui_weighted_deck_drops_smoke.py
          PYTHONPATH=. xvfb-run -a python tests/gui_mod_smoke.py
          PYTHONPATH=. xvfb-run -a python tests/gui_mod_tools_smoke.py
      - name: Empacotamento do atualizador
        run: python tools/package_source.py --out /tmp/FM-Mod-Studio-Source.zip
