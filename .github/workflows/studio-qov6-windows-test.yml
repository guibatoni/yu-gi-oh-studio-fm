name: Studio FM QOV6 - Windows test build (no release)
on:
  push:
    branches:
      - fix/quest-donation-retail-vm-deferred-qov6
    paths:
      - '.github/workflows/studio-qov6-windows-test.yml'
      - 'tools/ps1/campaign_quests.c'
      - 'tools/ps1/campaign_quest_loader.S'
      - 'fmstudio/ps1_campaign_quest_overlay_blob.py'
      - 'fmstudio/ps1_campaign_quests.py'
      - 'tests/test_campaign_quests.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-qov6-test:
    runs-on: windows-latest
    steps:
      - name: Obter codigo do candidato QOV6
        uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de teste e empacotamento
        run: python -m pip install pillow unicorn==2.1.4 pyinstaller
      - name: Testar quest/VM e ABI MIPS
        run: python -m unittest discover -s tests -p test_campaign_quests.py -v
      - name: Compilar Studio Windows QOV6
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "assets/icons;assets/icons" --collect-all PIL --name FM-Mod-Studio app.py
      - name: Compilar atualizador independente (nao publicar)
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FM-Mod-Studio-Updater updater_main.py
      - name: Empacotar candidato e checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/FM-Mod-Studio.exe release/FM-Mod-Studio.exe
          Copy-Item dist/FM-Mod-Studio-Updater.exe release/FM-Mod-Studio-Updater.exe
          Copy-Item LEIA-ME.txt release/LEIA-ME.txt
          Copy-Item INICIAR.bat release/INICIAR.bat
          Copy-Item docs/CANDIDATO_QOV6_LOAD_DELAY_VM_DUEL.md release/QOV6-VALIDACAO.md
          Compress-Archive -Path release/* -DestinationPath Studio-FM-QOV6-Windows-Test.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 Studio-FM-QOV6-Windows-Test.zip).Hash.ToLowerInvariant()
          "$hash  Studio-FM-QOV6-Windows-Test.zip" | Set-Content -Encoding ascii Studio-FM-QOV6-Windows-Test.zip.sha256
      - name: Disponibilizar binario de teste (sem ROM ou release oficial)
        uses: actions/upload-artifact@v4
        with:
          name: Studio-FM-QOV6-Windows-Test
          path: |
            Studio-FM-QOV6-Windows-Test.zip
            Studio-FM-QOV6-Windows-Test.zip.sha256
          retention-days: 14
